[build]
  publish = "test"
  # Only build on production (a push/merge to the site's production
  # branch). Deploy-previews (PRs) and branch-deploys (pushes to any
  # other branch) are skipped to conserve the Netlify free plan's
  # limited monthly build credits - pushing to GitHub should never by
  # itself trigger a paid Netlify deploy. Exit 0 = skip, exit 1 = build.
  ignore = "if [ \"$CONTEXT\" = \"production\" ]; then exit 1; else exit 0; fi"

# Serve the branded solar-monteur 404 page for unmatched paths under that
# project, instead of falling back to the site-wide generic 404.html.
[[redirects]]
  from = "/solar-monteur/*"
  to = "/solar-monteur/404.html"
  status = 404

# Baseline security headers. script-src/style-src need 'unsafe-inline'
# since the site is static HTML with inline JSON-LD blocks and a couple
# of small inline scripts/styles (no build step to hash or nonce them).
# frame-src allows the Google Maps embed on the Kontakt section (loaded
# only after a user click, see js/script.js). script-src/connect-src
# allow Google Analytics (GA4) so the cookie-consent-gated loader in
# js/script.js can fetch gtag.js and send hits *after* the user opts in
# via the cookie banner - CSP only permits the domain, the JS still
# decides whether/when to actually request it.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-src https://www.google.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
