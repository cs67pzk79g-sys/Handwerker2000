[build]
  publish = "test"
  # Skip deploy-preview builds (one per PR) to save build minutes.
  # Exit 0 = skip, exit 1 = build. Production/branch deploys still run.
  ignore = "if [ \"$CONTEXT\" = \"deploy-preview\" ]; then exit 0; else exit 1; fi"

# Serve the branded solar-monteur 404 page for unmatched paths under that
# project, instead of falling back to the site-wide generic 404.html.
[[redirects]]
  from = "/solar-monteur/*"
  to = "/solar-monteur/404.html"
  status = 404

# Baseline security headers. script-src/style-src need 'unsafe-inline'
# since the site is static HTML with inline JSON-LD blocks and a couple
# of small inline scripts/styles (no build step to hash or nonce them).
# frame-src allows the Google Maps embed on the Kontakt section.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-src https://www.google.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
