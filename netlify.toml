[build]
  publish = "test"
  # Deploy-preview skip TEMPORARILY DISABLED for this PR (new logo everywhere,
  # user wants a live preview link). Restore the ignore rule after merging:
  # ignore = "if [ \"$CONTEXT\" = \"deploy-preview\" ]; then exit 0; else exit 1; fi"

# Serve the branded solar-monteur 404 page for unmatched paths under that
# project, instead of falling back to the site-wide generic 404.html.
[[redirects]]
  from = "/solar-monteur/*"
  to = "/solar-monteur/404.html"
  status = 404
